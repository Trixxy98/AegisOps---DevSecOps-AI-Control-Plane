services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegisops
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisops_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aegisops
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aegisops", "-d", "aegisops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    networks:
      - aegisops
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AegisOps.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=aegisops;Username=aegisops;Password=${POSTGRES_PASSWORD:-aegisops_dev}
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (at least 32 bytes)}
      Database__MigrateOnStartup: "true"
      Storage__ReportsPath: /app/reports
    volumes:
      - reports:/app/reports
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegisops

  worker:
    build:
      context: .
      dockerfile: src/AegisOps.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=aegisops;Username=aegisops;Password=${POSTGRES_PASSWORD:-aegisops_dev}
    volumes:
      - reports:/app/reports
    depends_on:
      api:
        condition: service_started
    networks:
      - aegisops

  web:
    build:
      context: .
      dockerfile: src/AegisOps.Web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - aegisops

volumes:
  pgdata:
  reports:

networks:
  aegisops:
    name: aegisops
