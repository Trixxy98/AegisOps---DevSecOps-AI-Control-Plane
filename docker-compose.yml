services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegisops
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisops_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aegisops
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aegisops", "-d", "aegisops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      # 6380 on the host: avoids clashing with a local (e.g. Homebrew) Redis on 6379. Override with AEGISOPS_REDIS_PORT.
      - "127.0.0.1:${AEGISOPS_REDIS_PORT:-6380}:6379"
    networks:
      - aegisops
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AegisOps.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=aegisops;Username=aegisops;Password=${POSTGRES_PASSWORD:-aegisops_dev}
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (at least 32 bytes)}
      WebhookSecrets__Enabled: ${WEBHOOK_SECRETS_ENABLED:-false}
      WebhookSecrets__CurrentKeyId: ${WEBHOOK_SECRETS_CURRENT_KEY_ID:-key1}
      WebhookSecrets__Keys__key1: ${WEBHOOK_SECRETS_KEY_1:-}
      WebhookSecrets__Keys__key2: ${WEBHOOK_SECRETS_KEY_2:-}
      Database__MigrateOnStartup: "true"
      Storage__ReportsPath: /app/reports
    volumes:
      - reports:/app/reports
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegisops

  worker:
    build:
      context: .
      dockerfile: src/AegisOps.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=aegisops;Username=aegisops;Password=${POSTGRES_PASSWORD:-aegisops_dev}
      ConnectionStrings__Redis: redis:6379
      WebhookSecrets__Enabled: ${WEBHOOK_SECRETS_ENABLED:-false}
      WebhookSecrets__CurrentKeyId: ${WEBHOOK_SECRETS_CURRENT_KEY_ID:-key1}
      WebhookSecrets__Keys__key1: ${WEBHOOK_SECRETS_KEY_1:-}
      WebhookSecrets__Keys__key2: ${WEBHOOK_SECRETS_KEY_2:-}
      DOCKER_HEALTH_HOST: host.docker.internal
      Storage__ReportsPath: /app/reports
      Storage__ReportRetentionDays: ${REPORT_RETENTION_DAYS:-90}
    volumes:
      - reports:/app/reports
      - /var/run/docker.sock:/var/run/docker.sock
    # Grant the socket's group, not root: set DOCKER_GID to `stat -c %g /var/run/docker.sock`
    # on Linux hosts (Docker Desktop's VM socket is group 0). Mounting the socket is
    # root-equivalent on the host; see docs/14 for the docker-socket-proxy alternative.
    group_add:
      - "${DOCKER_GID:-0}"
    depends_on:
      api:
        condition: service_started
    networks:
      - aegisops

  web:
    build:
      context: .
      dockerfile: src/AegisOps.Web/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - aegisops

  # Opt-in local LLM: `docker compose --profile ai up -d`. The API's default
  # Ai:Ollama:BaseUrl is http://ollama:11434/. Not published to the host.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama
    networks:
      - aegisops
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:0.12.6
    profiles: ["ai"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - aegisops

volumes:
  pgdata:
  reports:
  ollama:

networks:
  aegisops:
    name: aegisops
