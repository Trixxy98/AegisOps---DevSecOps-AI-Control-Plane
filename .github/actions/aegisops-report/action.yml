name: Report to AegisOps
description: Register an artifact and request a deployment.
inputs:
  url:
    description: AegisOps API base URL, without a trailing slash.
    required: true
  api-key:
    description: Project API key.
    required: true
  project:
    description: Project slug.
    required: true
  version:
    description: Artifact version.
    required: true
  commit-sha:
    description: Git commit SHA.
    required: true
  branch:
    description: Git branch.
    required: true
  image:
    description: Image reference.
    required: true
  digest:
    description: Image digest.
    required: false
    default: ""
  test-summary:
    description: Path to a test summary JSON file.
    required: false
    default: ""
  scans:
    description: Comma-separated SARIF paths (gitleaks, semgrep, trivy). Missing paths fail the report.
    required: false
    default: ""
  deploy-to:
    description: Environment tier to request, usually Staging.
    required: false
    default: Staging
runs:
  using: composite
  steps:
    - name: Register artifact and request deployment
      shell: bash
      env:
        AEGISOPS_URL: ${{ inputs.url }}
        AEGISOPS_API_KEY: ${{ inputs.api-key }}
        AEGISOPS_PROJECT: ${{ inputs.project }}
        AEGISOPS_VERSION: ${{ inputs.version }}
        AEGISOPS_SHA: ${{ inputs.commit-sha }}
        AEGISOPS_BRANCH: ${{ inputs.branch }}
        AEGISOPS_IMAGE: ${{ inputs.image }}
        AEGISOPS_DIGEST: ${{ inputs.digest }}
        AEGISOPS_SUMMARY: ${{ inputs.test-summary }}
        AEGISOPS_DEPLOY: ${{ inputs.deploy-to }}
        AEGISOPS_SCANS: ${{ inputs.scans }}
        AEGISOPS_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.version }}
      run: bash "${GITHUB_ACTION_PATH}/report.sh"
