# Weekly dependency updates (docs/14-devops-and-infrastructure.md §3).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
  - package-ecosystem: npm
    directory: "/src/AegisOps.Web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # react and react-dom must move together (separate PRs fail CI on a version mismatch).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: docker
    directories:
      - "/src/AegisOps.Api"
      - "/src/AegisOps.Worker"
      - "/src/AegisOps.Web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The web image follows nginx's stable line (even minor versions); odd minors are mainline.
      - dependency-name: "nginx"
        versions: ["1.31.x", "1.33.x", "1.35.x"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
