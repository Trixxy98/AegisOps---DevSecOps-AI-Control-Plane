# Weekly dependency updates (docs/14-devops-and-infrastructure.md §3).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
  - package-ecosystem: npm
    directory: "/src/AegisOps.Web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # react and react-dom must move together (separate PRs fail CI on a version mismatch).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # eslint and @eslint/js must move together (separate PRs fail CI).
      eslint:
        patterns: ["eslint", "@eslint/js"]
    ignore:
      # ESLint 10 is blocked until eslint-plugin-jsx-a11y declares support (6.10.2 peers eslint <= 9).
      # Remove this rule when it does, and upgrade eslint and @eslint/js together.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - "/src/AegisOps.Api"
      - "/src/AegisOps.Worker"
      - "/src/AegisOps.Web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The web image follows nginx's stable line (even minor versions); odd minors are mainline.
      - dependency-name: "nginx"
        versions: ["1.31.x", "1.33.x", "1.35.x"]
      # The projects target net10.0 (LTS): a new .NET major is a planned retarget, not an image bump.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      # Build with Node.js LTS lines only (even majors); odd majors are never LTS.
      - dependency-name: "node"
        versions: ["23.x", "25.x", "27.x"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
