name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AegisOps.slnx

      # Restore already runs NuGet audit (direct + transitive; NU190x are errors through TreatWarningsAsErrors).
      # This step lists every known-vulnerable package explicitly and fails on any of them, whatever the severity.
      - name: Vulnerable NuGet packages
        run: |
          set -euo pipefail
          dotnet list AegisOps.slnx package --vulnerable --include-transitive --format json > vulnerable-packages.json
          errors="$(jq '[.problems[]? | select(.level == "error")] | length' vulnerable-packages.json)"
          if [[ "$errors" != "0" ]]; then
            jq -r '.problems[]? | "\(.level): \(.text)"' vulnerable-packages.json
            echo "::error::dotnet list package --vulnerable reported problems."
            exit 1
          fi
          found="$(jq -r '.projects[]? | .path as $project | .frameworks[]? | .framework as $framework
            | ((.topLevelPackages // []) + (.transitivePackages // []))[]
            | select((.vulnerabilities // []) | length > 0)
            | "\($project) [\($framework)] \(.id) \(.resolvedVersion): \([.vulnerabilities[].severity] | join(", ")) \([.vulnerabilities[].advisoryurl] | join(" "))"' \
            vulnerable-packages.json)"
          if [[ -n "$found" ]]; then
            printf '%s\n' "$found"
            echo "::error::Vulnerable NuGet packages found; update them in Directory.Packages.props."
            exit 1
          fi
          echo "No vulnerable NuGet packages."

      - name: Build
        run: dotnet build AegisOps.slnx --no-restore

      - name: Test
        run: dotnet test AegisOps.slnx --no-build

      - name: CI report contract
        run: bash tests/report-action.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AegisOps.Web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/AegisOps.Web/package-lock.json

      - name: Install
        run: npm ci

      # Runtime dependencies only: they are what the built SPA ships. Dev tooling (Vite, ESLint, Playwright) never
      # reaches the nginx image; Dependabot still raises updates for it.
      - name: npm audit (runtime, high and critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck and build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Prepare report directory
        run: mkdir -p security-reports

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Writes every finding (all severities) to SARIF; the "Semgrep gate" step at the end fails the job on ERROR ones.
      - name: Semgrep
        id: semgrep
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            semgrep/semgrep:1.177.0 \
            semgrep \
            scan \
            --config p/default \
            --config p/security-audit \
            --config p/csharp \
            --config p/owasp-top-ten \
            --metrics=off \
            --sarif \
            --output security-reports/semgrep.sarif

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL
          exit-code: "1"
          format: sarif
          output: security-reports/trivy.sarif
          limit-severities-for-sarif: true
          version: v0.71.0

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-sarif
          path: security-reports/*.sarif

      - name: Upload SARIF to code scanning
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: security-reports

      # Runs last so a Semgrep failure never skips the SARIF uploads above. ERROR severity is SARIF level "error" (per result or
      # from the rule's default configuration); WARNING/INFO findings are reported but do not fail the build.
      - name: Semgrep gate (ERROR findings)
        if: always() && steps.semgrep.outcome == 'success'
        run: |
          set -euo pipefail
          errors="$(jq -r '.runs[]?
            | ((.tool.driver.rules // []) | map({key: .id, value: (.defaultConfiguration.level // "warning")}) | from_entries) as $levels
            | .results[]?
            | select((.level // $levels[.ruleId] // "warning") == "error")
            | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // "?")"' \
            security-reports/semgrep.sarif)"
          if [[ -n "$errors" ]]; then
            printf '%s\n' "$errors"
            echo "::error::Semgrep reported ERROR-severity findings."
            exit 1
          fi
          echo "No ERROR-severity Semgrep findings."
