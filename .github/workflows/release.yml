name: Release

# Pushing a version tag (for example `git tag v1.0.0 && git push origin v1.0.0`) builds the three AegisOps
# images, refuses to publish any image with a CRITICAL vulnerability, pushes them to GHCR as multi-arch
# (linux/amd64 + linux/arm64) ghcr.io/<owner>/aegisops-{api,worker,web}:<tag>, and creates the GitHub Release
# (docs/19, P8-15).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            dockerfile: src/AegisOps.Api/Dockerfile
          - component: worker
            dockerfile: src/AegisOps.Worker/Dockerfile
          - component: web
            dockerfile: src/AegisOps.Web/Dockerfile
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Image name
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aegisops-${{ matrix.component }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      # arm64 runtime stages run under emulation; the SDK/Node build stages use $BUILDPLATFORM (see the Dockerfiles).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # A multi-platform build cannot be loaded into the local Docker image store, so the gate scans the amd64
      # image; the arm64 image is built from the same Dockerfile and sources in the push step below.
      - name: Build (local, for the scan)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.image }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}

      - name: Record digest
        run: echo "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "Container images:"
            echo
            for component in api worker web; do
              echo "- \`ghcr.io/${owner}/aegisops-${component}:${TAG}\`"
            done
            echo
            echo "See CHANGELOG.md for the curated change list."
          } > release-notes.md
          gh release create "$TAG" --title "AegisOps $TAG" --notes-file release-notes.md --generate-notes --verify-tag
