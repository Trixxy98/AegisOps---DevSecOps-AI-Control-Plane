name: Release

# Pushing a version tag (for example `git tag v1.0.0 && git push origin v1.0.0`) builds the three AegisOps
# images, refuses to publish any image with a CRITICAL vulnerability, pushes them to GHCR as
# ghcr.io/<owner>/aegisops-{api,worker,web}:<tag>, and creates the GitHub Release (docs/19, P8-15).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            dockerfile: src/AegisOps.Api/Dockerfile
          - component: worker
            dockerfile: src/AegisOps.Worker/Dockerfile
          - component: web
            dockerfile: src/AegisOps.Web/Dockerfile
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image name
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aegisops-${{ matrix.component }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (local, for the scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}

      - name: Record digest
        run: echo "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "Container images:"
            echo
            for component in api worker web; do
              echo "- \`ghcr.io/${owner}/aegisops-${component}:${TAG}\`"
            done
            echo
            echo "See CHANGELOG.md for the curated change list."
          } > release-notes.md
          gh release create "$TAG" --title "AegisOps $TAG" --notes-file release-notes.md --generate-notes --verify-tag
