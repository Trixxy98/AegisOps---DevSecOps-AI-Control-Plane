# Only WebSocket upgrades are forwarded to the API (blocks h2c smuggling through the /hubs/ proxy).
map $http_upgrade $ws_upgrade {
    default "";
    websocket websocket;
}
map $http_upgrade $ws_connection {
    default "";
    websocket upgrade;
}
# Keep the scheme a TLS proxy in front (deploy/docker-compose.tls.yml) reported; otherwise our own.
# The API only trusts these headers when ForwardedHeaders:Enabled is set (docs/17).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    # Resolve the API through Docker's DNS on each request (cached 10 s) instead of once at startup, so nginx starts
    # even when the api container is not up yet (e.g. after a Docker or host restart) and answers 502 until it is.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Host is deliberately not forwarded from the client: the API never builds URLs from it, so the upstream name
    # (api:8080, nginx's default Host for proxy_pass) is used instead of a client-controlled value.
    location /api/ {
        # Scan reports up to the API's 20 MiB limit (UploadScan.MaxBytes) plus multipart overhead; nginx's default is 1 MiB.
        client_max_body_size 21m;
        # $api_upstream is a constant set above (never request data), so this is not an open proxy.
        proxy_pass $api_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /hubs/ {
        # $api_upstream is a constant set above (never request data), so this is not an open proxy.
        proxy_pass $api_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        # Upgrade is only ever "websocket" or empty ($ws_upgrade, map above): the rule's own h2c mitigation.
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade $ws_upgrade;
        proxy_set_header Connection $ws_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # index.html (and every SPA route that falls back to it) is revalidated on each load, so a new release is picked up
    # without a hard reload. `expires` sets Cache-Control without add_header, which would drop the security headers above.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Vite puts a content hash in every asset file name, so these never change and can be cached for a year.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
    }
}
