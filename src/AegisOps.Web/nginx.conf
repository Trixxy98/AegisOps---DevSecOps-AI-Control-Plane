# Only WebSocket upgrades are forwarded to the API (blocks h2c smuggling through the /hubs/ proxy).
map $http_upgrade $ws_upgrade {
    default "";
    websocket websocket;
}
map $http_upgrade $ws_connection {
    default "";
    websocket upgrade;
}
# Keep the scheme a TLS proxy in front (deploy/docker-compose.tls.yml) reported; otherwise our own.
# The API only trusts these headers when ForwardedHeaders:Enabled is set (docs/17).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        # Scan reports up to the API's 20 MiB limit (UploadScan.MaxBytes) plus multipart overhead; nginx's default is 1 MiB.
        client_max_body_size 21m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        # Upgrade is only ever "websocket" or empty ($ws_upgrade, map above): the rule's own h2c mitigation.
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade $ws_upgrade;
        proxy_set_header Connection $ws_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
