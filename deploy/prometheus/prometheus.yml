global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: aegisops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9464"]
  - job_name: aegisops-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8081"]
