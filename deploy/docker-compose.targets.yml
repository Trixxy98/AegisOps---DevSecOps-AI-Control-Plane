# Target services. Staging and Production run on separate named networks that the
# Worker can attach deployed containers to (DeploymentTarget.Network, e.g. the seeded
# `aegisops-staging`). Production containers cannot reach Staging ones by name.
services:
  site-service-staging:
    image: ghcr.io/aegisops/site-service:latest
    ports: ["8101:8080"]
    networks: [aegisops-staging]
  circuit-service-staging:
    image: ghcr.io/aegisops/circuit-service:latest
    ports: ["8102:8080"]
    networks: [aegisops-staging]
  notification-service-staging:
    image: ghcr.io/aegisops/notification-service:latest
    ports: ["8103:8080"]
    networks: [aegisops-staging]
  site-service-production:
    image: ghcr.io/aegisops/site-service:latest
    ports: ["8201:8080"]
    networks: [aegisops-production]
  circuit-service-production:
    image: ghcr.io/aegisops/circuit-service:latest
    ports: ["8202:8080"]
    networks: [aegisops-production]
  notification-service-production:
    image: ghcr.io/aegisops/notification-service:latest
    ports: ["8203:8080"]
    networks: [aegisops-production]

networks:
  aegisops-staging:
    name: aegisops-staging
  aegisops-production:
    name: aegisops-production
